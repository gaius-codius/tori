name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Shared Go checks: pinned Go, tests (shuffled, with coverage), race,
    # vet, lint, the govulncheck gate and the build. See gaius-codius/go-ci.
    uses: gaius-codius/go-ci/.github/workflows/go.yml@a51a90f115371e443addbf1b2620246001e3934c # v2.0.0
    with:
      runs-on: '["ubuntu-latest"]'
      build: ./cmd/tori/
      mise-cache: true

  aria2:
    # The downloader integration tests skip without aria2c, so run them where it is installed.
    name: aria2-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Run downloader integration tests
        run: go test ./internal/aria2/
